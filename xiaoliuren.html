  {n:'大安',wx:'木',sx:'青龙',fx:'东方',luck:'吉',ying:'静迟稳',xiang:'安稳、静止、守成',

/* 江氏完整六宫。与三宫变体分开。月从速喜起（旧 m0:2）不再进入本支。 */
const JG_NAME=['大安','留连','速喜','赤口','小吉','空亡'];
const JG_LS=['青龙','朱雀','勾陈','白虎','玄武','腾蛇'];
const JG_STAR=['木星','火星','土星','金星','水星','天空'];
const JG_ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const JG_WX={};
'寅卯'.split('').forEach(function(z){ JG_WX[z]='木'; });
'巳午'.split('').forEach(function(z){ JG_WX[z]='火'; });
'申酉'.split('').forEach(function(z){ JG_WX[z]='金'; });
'亥子'.split('').forEach(function(z){ JG_WX[z]='水'; });
'辰戌丑未'.split('').forEach(function(z){ JG_WX[z]='土'; });
const JG_SHENG={木:'火',火:'土',土:'金',金:'水',水:'木'};
const JG_KE={木:'土',火:'金',土:'水',金:'木',水:'火'};
const JG_YONG=[
  ['self','自身'],
  ['parents','父母'],
  ['bro','兄弟'],
  ['child','子孙'],
  ['wife','妻财'],
  ['ghost','官鬼'],
  ['dui','对宫']
];
const JG_YONG_MAP={parents:'父母',bro:'兄弟',child:'子孙',wife:'妻财',ghost:'官鬼'};
function jgMod6(n){ return ((n%6)+6)%6; }
function jgMod12(n){ return ((n%12)+12)%12; }
function jgQin(selfB, otherB){
  const me=JG_WX[selfB], he=JG_WX[otherB];
  if(me===he) return '兄弟';
  if(JG_SHENG[me]===he) return '子孙';
  if(JG_SHENG[he]===me) return '父母';
  if(JG_KE[me]===he) return '妻财';
  if(JG_KE[he]===me) return '官鬼';
  return '兄弟';
}
function jgLsStart(selfB){
  const pair={子:0,午:0,丑:1,未:1,寅:2,申:2,卯:3,酉:3,辰:4,戌:4,巳:5,亥:5};
  return pair[selfB]!=null?pair[selfB]:0;
}
function jiangFill(dayP, selfP, selfB){
  const sb=JG_ZHI.indexOf(selfB);
  const pb=[], pq=[], pls=[], pw=[];
  for(let i=0;i<6;i++) pb[jgMod6(selfP+i)]=JG_ZHI[jgMod12(sb+i*2)];
  for(let k=0;k<6;k++) pq[k]=k===selfP?'自身':jgQin(selfB, pb[k]);
  if(selfB==='子'||selfB==='亥'){
    for(let j=1;j<6;j++){
      const idx=jgMod6(selfP+j);
      if(JG_WX[pb[idx]]==='土'){ pq[idx]='兄弟'; break; }
    }
  }
  const s0=jgLsStart(selfB);
  for(let a=0;a<6;a++) pls[jgMod6(s0+a)]=JG_LS[a];
  for(let b=0;b<6;b++) pw[jgMod6(dayP+b)]=JG_STAR[b];
  return {pb:pb, pq:pq, pls:pls, pw:pw};
}
function jYongPal(yong, fill, selfP, dayP){
  if(yong==='self') return selfP;
  if(yong==='dui') return dayP;
  const t=JG_YONG_MAP[yong];
  if(t){ for(let i=0;i<6;i++) if(fill.pq[i]===t) return i; }
  return selfP;
}
/* 日时起课：大安起初一，日落宫起子时。报数：诸数和除以 6 取余定日宫，再结合时辰定身宫。 */
function jiangCast(input){
  let dayP, nums=null, sum=0;
  const hourN=Math.min(12, Math.max(1, input.hourN||1));
  if(input.mode==='num'){
    nums=(input.nums||[]).map(function(n){ return Math.abs(parseInt(n,10)||0); }).filter(function(n){ return n>0; });
    if(nums.length<3) return {error:'报数起课至少要 3 个数，当前 '+nums.length+' 个'};
    nums.forEach(function(n){ sum+=n; });
    const rem=sum%6;
    dayP=rem===0?5:rem-1;
  }else{
    const day=Math.min(30, Math.max(1, input.day||1));
    dayP=jgMod6(day-1);
  }
  const selfP=jgMod6(dayP+hourN-1);
  const selfB=JG_ZHI[jgMod12(hourN-1)];
  const fill=jiangFill(dayP, selfP, selfB);
  const yong=input.yong||'self';
  const yp=jYongPal(yong, fill, selfP, dayP);
  return {mode:input.mode||'date', day:input.day, hourN:hourN, nums:nums, sum:sum, dayP:dayP, selfP:selfP, selfB:selfB, fill:fill, yong:yong, yp:yp};
}

  const cards=[];
  for(let gp=0;gp<6;gp++){
    const z=diZ[(gp-gTime+6)%6];
    const rel=daoRel(selfZ, ZHI.indexOf(z), (gp-gTime+6)%6);
    const g=GONG[gp];
    const role=gp===gMonth?'天宫':gp===gDay?'地宫':gp===gTime?'人宫':'六宫';
    cards.push(layerCard(gp===gTime, g.n, role,
      '地'+z+' '+rel+'　天'+(tian[gp]||''),
      (stars[gp]||'')+' · '+(gods[gp]||'')+' · '+dirs[gp],
      '宿 '+xiuPair(ZHI[selfZ], tian[gp], 1)+' / '+xiuPair(ZHI[selfZ], z, 2)));
  }
  const way = (dayYang?'阳日':'阴日')+(male?'男':'女')+(forward?'顺':'逆');
  return '<h3 class="rel-title">玄盘</h3><p class="xlr-src">地盘从人宫起时支，隔支。天盘把天宫地支放到地宫，'+way+'。阳日男、阴日女顺，阴日男、阳日女逆。六星从地宫起木星。六神从天宫按日干'+pk.dayGan+'起。星宿两轮，天盘在前，地盘在后。坐标以人宫为太极，下一宫起东。人盘、透宫、穿门、神煞未公开，不编。</p>'
    +'<div class="xlr-layer">'+cards.join('')+'</div>'
    +'<p class="xlr-src">四柱 '+pk.year+' '+pk.month+' '+pk.day+' '+pk.time+'。空亡 '+pk.kong.join(' / ')+'</p>';
}
function daoRel(selfZ, z, i){
  if(i===0) return '自身';
  const me=ZHI[selfZ], other=ZHI[z];
  if(JG_WX[other]!=='土') return jgQin(me, other);
  const earths=[];
  for(let k=1;k<6;k++){
    const zz=(selfZ+k*2)%12;
    if(JG_WX[ZHI[zz]]==='土') earths.push(zz);
  }
  if(earths.length>=2) return earths[0]===z?'兄弟':'父母';
  return '父母';
}
function shangGong(zhi){
  const keys=Object.keys(SHANG_GONG);
  for(let i=0;i<keys.length;i++) if(keys[i].indexOf(zhi)>=0) return SHANG_GONG[keys[i]];
  return '';
}
</script>
